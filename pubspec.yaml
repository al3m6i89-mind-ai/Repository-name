name: admin_hub
description: "لوحة تحكم تطبيقاتي: إدارة مستخدمي كل تطبيق."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  dart_jsonwebtoken: ^3.4.1
  crypto: ^3.0.6
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: assets/branding/icon_background.png
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#4338CA"
    theme_color: "#5B3FE0"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/icon.png
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-400.ttf
        - asset: assets/fonts/Tajawal-500.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-700.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-800.ttf
          weight: 800
