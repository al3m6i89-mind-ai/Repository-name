name: Build Admin Hub APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: admin-hub-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      # A release gives a direct download link that opens on the phone:
      # https://github.com/<owner>/<repo>/releases/latest/download/admin-hub.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk admin-hub.apk
          gh release create "build-${{ github.run_number }}" admin-hub.apk \
            --title "لوحة تطبيقاتي ${{ github.run_number }}" --notes "${{ github.event.head_commit.message || 'Manual build' }}" --latest
